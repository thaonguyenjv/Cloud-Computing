{% extends 'base_auth.html' %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-4 text-center fw-bold">Đăng ký shop mới</h4>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Tên shop</label>
            <input type="text" name="shop_name" class="form-control" required placeholder="VD: Coffee ABC">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <button type="submit" class="btn btn-dark w-100">Tạo tài khoản</button>
        </form>
        <hr>
        <p class="text-center text-muted small mb-0">
          Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
