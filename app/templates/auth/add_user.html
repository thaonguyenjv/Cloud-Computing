{% extends 'base.html' %}
{% block title %}Thêm nhân viên{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4"><i class="bi bi-person-plus"></i> Thêm nhân viên mới</h5>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">Vai trò</label>
            <select name="role" class="form-select">
              <option value="staff">Nhân viên</option>
              <option value="admin">Quản lý</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">
              <i class="bi bi-check-lg"></i> Thêm
            </button>
            <a href="{{ url_for('auth.list_users') }}" class="btn btn-outline-secondary">Huỷ</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
