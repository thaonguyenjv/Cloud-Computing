{% extends 'base.html' %}
{% block title %}{{ 'Sửa' if product else 'Thêm' }} sản phẩm{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4">
          {{ 'Sửa sản phẩm' if product else 'Thêm sản phẩm mới' }}
        </h5>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required
                   value="{{ product.name if product else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Giá (VNĐ) <span class="text-danger">*</span></label>
            <input type="number" name="price" class="form-control" required min="0" step="1000"
                   value="{{ product.price if product else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Danh mục</label>
            <input type="text" name="category" class="form-control"
                   placeholder="VD: Đồ uống, Thức ăn..."
                   value="{{ product.category if product else '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea name="description" class="form-control" rows="2">{{ product.description if product else '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-dark">
              <i class="bi bi-check-lg"></i> Lưu
            </button>
            <a href="{{ url_for('product.list_products') }}" class="btn btn-outline-secondary">Huỷ</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
